spring.application.name=pix

# ??? DataSource (H2) ???????????????????????????????????????????????????????????
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ??? Spring Data JDBC ?????????????????????????????????????????????????????????
# explicitly set the dialect (optional?Spring can often detect this)
spring.data.jdbc.dialect=H2
# control whether to run schema/data scripts (embedded only)
spring.data.jdbc.initialization-mode=always

# ??? SQL initialization (optional) ?????????????????????????????????????????????
# Use Spring?s SQL initializer to load schema.sql / data.sql from classpath
spring.sql.init.platform=h2
spring.sql.init.mode=always
# (if you want custom locations)
# spring.sql.init.schema-locations=classpath:db/schema-h2.sql
# spring.sql.init.data-locations=classpath:db/data-h2.sql

# ??? H2 Console (browser UI) ????????????????????????????????????????????????????
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console